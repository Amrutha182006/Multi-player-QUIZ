<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Test</title>
</head>

<body>

    <h2>WebSocket Test</h2>

    <button onclick="connect()">Connect</button>
    <button onclick="sendMessage()">Send Hello</button>

    <p id="output"></p>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>

    <script>

        let client = null;

        function connect() {

            client = new StompJs.Client({
                brokerURL: 'ws://localhost:8080/ws',

                debug: function (str) {
                    console.log(str);
                }
            });

            client.onConnect = function () {

                console.log("STOMP connected");

                document.getElementById("output").innerHTML +=
                    "<p>Connected!</p>";

                client.subscribe('/topic/room/03E9A8', function (message) {

                    console.log("ROOM EVENT:", message.body);

                    document.getElementById("output").innerHTML +=
                        "<p>" + message.body + "</p>";
                });
            };

            client.onStompError = function (frame) {
                console.error("STOMP ERROR:", frame);
            };

            client.activate();
        }


        function sendMessage() {

            if (client === null) {
                console.log("Client is not initialized");
                return;
            }

            if (!client.connected) {
                console.log("STOMP is not connected");
                return;
            }

            client.publish({
                destination: '/app/hello',
                body: 'Hello Server'
            });

            console.log("Message sent!");
        }

    </script>

</body>

</html>
